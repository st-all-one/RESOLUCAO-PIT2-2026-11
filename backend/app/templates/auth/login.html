{% extends "base.html" %}

{% block titulo %}Entrar · Cupcake Gourmet{% endblock %}

{% block conteudo %}
<section class="cartao">
  <h1>Entrar</h1>
  {% include "componentes/erro_form.html" %}

  <form method="post" action="/login" class="campos">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ proximo }}">

    <div class="campo">
      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
        value="{{ valores.get('email', '') }}"
      >
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        autocomplete="current-password"
        required
        minlength="8"
      >
    </div>

    <button class="botao" type="submit">Entrar</button>
  </form>

  <p class="texto-suave">Ainda não tem conta? <a href="/cadastro">Criar conta</a></p>
</section>
{% endblock %}
