{% extends "base.html" %}

{% block titulo %}Criar conta · Cupcake Gourmet{% endblock %}

{% block conteudo %}
<section class="cartao">
  <h1>Criar conta</h1>
  {% include "componentes/erro_form.html" %}

  <form method="post" action="/cadastro" class="campos">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

    <div class="campo">
      <label for="nome">Nome</label>
      <input
        id="nome"
        name="nome"
        type="text"
        autocomplete="name"
        required
        minlength="2"
        maxlength="120"
        value="{{ valores.get('nome', '') }}"
      >
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
        value="{{ valores.get('email', '') }}"
      >
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        autocomplete="new-password"
        required
        minlength="8"
        aria-describedby="ajuda-senha"
      >
      <span id="ajuda-senha" class="campo__ajuda">
        Mínimo de 8 caracteres, com ao menos uma letra e um número.
      </span>
    </div>

    <div class="campo">
      <label for="confirmacao">Confirmar senha</label>
      <input
        id="confirmacao"
        name="confirmacao"
        type="password"
        autocomplete="new-password"
        required
        minlength="8"
      >
    </div>

    <button class="botao" type="submit">Criar conta</button>
  </form>

  <p class="texto-suave">Já tem conta? <a href="/login">Entrar</a></p>
</section>
{% endblock %}
