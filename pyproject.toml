[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cupcake-gourmet"
version = "0.1.0"
description = "Loja de cupcakes gourmet — PIT Engenharia de Software II (2026/11)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "pymysql>=1.1,<2",
    "pydantic-settings>=2.4,<3",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: exige MariaDB em execução (ver compose.yaml)"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend", "tests", "backend/scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "DTZ",  # timezone
    "T20",  # print
    "PT",   # pytest style
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "S",    # bandit
    "ANN",  # annotations
    "ARG",  # unused arguments
    "TRY",  # exception handling
    "EM",   # error messages
    "ISC",  # implicit string concat
    "PTH",  # pathlib
]
# EM/N818/TRY003: o código do catálogo é a identidade da exceção; renomear
# exceções de domínio para o inglês ou extrair literais não agrega.
ignore = ["EM101", "EM102", "N818", "TRY003", "TRY301"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ANN", "ARG001", "PLR2004", "E402"]
"backend/app/controllers/*" = ["B008"]
"backend/scripts/*" = ["T201", "ANN001", "ANN201"]
"backend/app/core/templating.py" = ["S701"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["\\.venv", "backend/app/static", "node_modules"]

[[tool.mypy.overrides]]
module = ["pymysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.scripts.*"]
disallow_untyped_defs = false
warn_return_any = false
