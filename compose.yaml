services:
  mariadb:
    image: mariadb:11.4
    container_name: cupcake-mariadb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: cupcake_root
      MARIADB_DATABASE: cupcake
      MARIADB_USER: cupcake
      MARIADB_PASSWORD: cupcake
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - cupcake-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-pcupcake_root"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  cupcake-mariadb-data:
